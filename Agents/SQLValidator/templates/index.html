<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh — SQL Validator</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --accent: #f78166;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .layout { display: flex; height: 100vh; }
  .sidebar {
    width: 300px; background: var(--surface); border-right: 1px solid var(--border);
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto;
  }
  .main { flex: 1; display: flex; flex-direction: column; }
  .header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .header h1 { font-size: 18px; color: var(--accent); }
  .header .badge { font-size: 12px; color: var(--dim); }
  .query-area {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px;
  }
  textarea {
    width: 100%; min-height: 100px; background: var(--surface);
    color: var(--blue); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font: inherit; font-size: 14px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select, input, button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font: inherit; font-size: 13px;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer; font-weight: 600; transition: all .15s;
  }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); }
  button.primary:hover { opacity: 0.85; }
  button.ghost { background: transparent; border-color: var(--border); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .results {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap;
  }
  .report { font-family: inherit; }
  .report .pass { color: var(--green); }
  .report .fail { color: var(--red); }
  .report .warn { color: var(--amber); }
  .report .dim { color: var(--dim); }
  .report .hl { color: var(--purple); }
  .sidebar h2 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .sidebar .sample-btn {
    width: 100%; text-align: left; padding: 10px 12px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; color: var(--dim); transition: all .12s;
  }
  .sidebar .sample-btn:hover { border-color: var(--accent); color: var(--text); }
  .sidebar .sample-btn .title { color: var(--text); display: block; font-weight: 600; }
  .sidebar .sample-btn .desc { font-size: 11px; margin-top: 2px; }
  .schema-panel { font-size: 12px; }
  .schema-panel .domain { color: var(--accent); font-weight: 600; margin-top: 8px; }
  .schema-panel .col-list { color: var(--dim); padding-left: 12px; }
  .groq-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .groq-toggle input { accent-color: var(--accent); }
  .spinner { display: none; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab-bar button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 10px 18px; color: var(--dim); font-size: 13px;
  }
  .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .generator-panel { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .gen-results {
    flex: 1; overflow-y: auto; padding: 20px 24px; font-size: 12px;
  }
  .gen-results table { width: 100%; border-collapse: collapse; }
  .gen-results th, .gen-results td {
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  .gen-results th { color: var(--accent); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Sample Queries</h2>
    <button class="sample-btn" onclick="loadSample(0)">
      <span class="title">Admin full access</span>
      <span class="desc">admin — sales_deals — all columns</span>
    </button>
    <button class="sample-btn" onclick="loadSample(1)">
      <span class="title">Sales rep blocked</span>
      <span class="desc">sales_rep tries margin, commission</span>
    </button>
    <button class="sample-btn" onclick="loadSample(2)">
      <span class="title">Sales rep safe query</span>
      <span class="desc">sales_rep — leads only</span>
    </button>
    <button class="sample-btn" onclick="loadSample(3)">
      <span class="title">Viewer restricted</span>
      <span class="desc">viewer tries deal_value</span>
    </button>
    <button class="sample-btn" onclick="loadSample(4)">
      <span class="title">No WHERE clause</span>
      <span class="desc">Triggers RLS violation</span>
    </button>
    <button class="sample-btn" onclick="loadSample(5)">
      <span class="title">Analyst sees salary</span>
      <span class="desc">analyst — hr_employees</span>
    </button>
    <button class="sample-btn" onclick="loadSample(6)">
      <span class="title">Support agent tickets</span>
      <span class="desc">support_agent — sensitive blocked</span>
    </button>

    <h2>Schema</h2>
    <div class="schema-panel" id="schemaPanel">Loading...</div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="tab-bar">
      <button class="active" onclick="switchTab('validate')">Validate</button>
      <button onclick="switchTab('batch')">Batch Upload</button>
      <button onclick="switchTab('generate')">Generate Data</button>
      <button onclick="switchTab('persona')">Persona</button>
    </div>

    <!-- Validate Tab -->
    <div id="tab-validate" class="query-area">
      <textarea id="sqlInput" placeholder="Enter SQL query to validate...">SELECT id, deal_stage, deal_value, margin, commission_pct FROM sales_deals WHERE assigned_to = 42</textarea>
      <div class="row">
        <select id="roleSelect" onchange="onRoleChange()">
          <option value="admin">admin</option>
          <option value="manager">manager</option>
          <option value="sales_rep" selected>sales_rep</option>
          <option value="analyst">analyst</option>
          <option value="support_agent">support_agent</option>
          <option value="viewer">viewer</option>
        </select>
        <input id="userIdInput" placeholder="User ID" value="rep42" size="12">
        <select id="domainSelect" onchange="onDomainChange()">
          <option value="">auto-detect</option>
          <option value="sales" selected>sales</option>
          <option value="hr">hr</option>
          <option value="finance">finance</option>
          <option value="inventory">inventory</option>
          <option value="support">support</option>
          <option value="engineering">engineering</option>
        </select>
        <select id="subdomainSelect">
          <option value="" selected>auto-detect</option>
        </select>
        <input id="tenantInput" placeholder="Tenant" value="default" size="10">
        <label class="groq-toggle">
          <input type="checkbox" id="groqToggle"> Groq LLM
        </label>
        <button class="primary" onclick="validate()">Validate</button>
        <span class="spinner" id="spinner">⟳</span>
      </div>
    </div>

    <!-- Batch Upload Tab -->
    <div id="tab-batch" class="query-area" style="display:none">
      <div style="border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center;">
        <input type="file" id="batchFileInput" accept=".json,.jsonl,.txt,.sql" style="display:none" onchange="handleBatchFile(event)">
        <button class="primary" onclick="document.getElementById('batchFileInput').click()" style="font-size: 14px; padding: 14px 28px;">
          📁 Choose File
        </button>
        <p style="margin-top: 10px; color: var(--dim); font-size: 12px;">
          JSON array, JSONL (one JSON per line), or plain SQL (one per line)
        </p>
      </div>
      <div class="row">
        <select id="batchRole">
          <option value="admin">admin</option>
          <option value="manager">manager</option>
          <option value="sales_rep" selected>sales_rep</option>
          <option value="analyst">analyst</option>
          <option value="support_agent">support_agent</option>
          <option value="viewer">viewer</option>
        </select>
        <input id="batchUser" value="rep42" size="12" placeholder="User ID">
        <input id="batchTenant" value="default" size="10" placeholder="Tenant">
        <label class="groq-toggle">
          <input type="checkbox" id="batchGroq"> Groq LLM
        </label>
        <span id="batchFileName" style="color: var(--dim); font-size: 12px;"></span>
      </div>
    </div>

    <!-- Generate Tab -->
    <div id="tab-generate" class="generator-panel" style="display:none">
      <div class="row">
        <select id="genDomain" onchange="onGenDomainChange()">
          <option value="sales">sales</option>
          <option value="hr">hr</option>
          <option value="finance">finance</option>
          <option value="inventory">inventory</option>
          <option value="support">support</option>
          <option value="engineering">engineering</option>
        </select>
        <select id="genSubdomain">
          <option value="leads">leads</option>
          <option value="deals">deals</option>
          <option value="accounts">accounts</option>
        </select>
        <input id="genRows" type="number" value="20" min="1" max="100" size="6">
        <label class="groq-toggle">
          <input type="checkbox" id="genGroq"> Groq LLM
        </label>
        <button class="primary" onclick="generateData()">Generate</button>
      </div>
    </div>

    <!-- Persona Tab -->
    <div id="tab-persona" style="display:none; padding: 24px; flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.7; white-space: pre-wrap;">
      Loading...
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <span class="dim">Enter a SQL query and click Validate, or pick a sample from the sidebar.</span>
    </div>
    <div class="gen-results" id="genResults" style="display:none"></div>
  </div>
</div>

<script>
// ── State ──
const SAMPLES = [
  { sql: "SELECT id, deal_stage, deal_value, margin, commission_pct, competitor_notes, assigned_to, expected_close_date FROM sales_deals WHERE assigned_to = 1",
    role: "admin", user: "admin1", domain: "sales", subdomain: "deals" },
  { sql: "SELECT id, deal_value, margin, commission_pct, competitor_notes FROM sales_deals WHERE assigned_to = 42",
    role: "sales_rep", user: "rep42", domain: "sales", subdomain: "deals" },
  { sql: "SELECT id, lead_name, company FROM sales_leads WHERE assigned_to = 42",
    role: "sales_rep", user: "rep42", domain: "sales", subdomain: "leads" },
  { sql: "SELECT id, company, deal_value FROM sales_deals WHERE tenant_id = 'default'",
    role: "viewer", user: "guest", domain: "sales", subdomain: "deals" },
  { sql: "SELECT * FROM hr_employees",
    role: "manager", user: "mgr1", domain: "hr", subdomain: "employees" },
  { sql: "SELECT id, department_id, title, hire_date, salary FROM hr_employees WHERE tenant_id = 'default'",
    role: "analyst", user: "alice", domain: "hr", subdomain: "employees" },
  { sql: "SELECT id, ticket_subject, customer_name, customer_email, internal_notes, sla_breach_log FROM support_tickets WHERE assigned_to = 5",
    role: "support_agent", user: "sue", domain: "support", subdomain: "tickets" },
];

const SUBDOMAINS = {
  sales: ["leads","deals","accounts"],
  hr: ["employees","performance","benefits"],
  finance: ["budget","payroll","transactions"],
  inventory: ["products","warehouse"],
  support: ["tickets"],
  engineering: ["projects","bugs"],
};

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  onDomainChange();
  loadSchema();
  loadPersona();
});

function onDomainChange() {
  const dom = document.getElementById('domainSelect').value;
  const sel = document.getElementById('subdomainSelect');
  sel.innerHTML = '<option value="" selected>auto-detect</option>';
  if (dom && SUBDOMAINS[dom]) {
    SUBDOMAINS[dom].forEach(sd => {
      sel.innerHTML += `<option value="${sd}">${sd}</option>`;
    });
  }
}

function onGenDomainChange() {
  const dom = document.getElementById('genDomain').value;
  const sel = document.getElementById('genSubdomain');
  sel.innerHTML = '';
  if (dom && SUBDOMAINS[dom]) {
    SUBDOMAINS[dom].forEach(sd => {
      sel.innerHTML += `<option value="${sd}">${sd}</option>`;
    });
  }
}

function loadSample(i) {
  const s = SAMPLES[i];
  document.getElementById('sqlInput').value = s.sql;
  document.getElementById('roleSelect').value = s.role;
  document.getElementById('userIdInput').value = s.user;
  document.getElementById('domainSelect').value = s.domain;
  onDomainChange();
  document.getElementById('subdomainSelect').value = s.subdomain;
  switchTab('validate');
  validate();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-validate').style.display = tab === 'validate' ? '' : 'none';
  document.getElementById('tab-batch').style.display = tab === 'batch' ? '' : 'none';
  document.getElementById('tab-generate').style.display = tab === 'generate' ? '' : 'none';
  document.getElementById('tab-persona').style.display = tab === 'persona' ? '' : 'none';
  document.getElementById('results').style.display = (tab === 'validate' || tab === 'batch') ? '' : 'none';
  document.getElementById('genResults').style.display = tab === 'generate' ? '' : 'none';
}

async function validate() {
  const sql = document.getElementById('sqlInput').value.trim();
  if (!sql) return;
  document.getElementById('spinner').style.display = 'inline';
  document.getElementById('results').innerHTML = '<span class="dim">Validating...</span>';

  try {
    const r = await fetch('/api/validate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        sql, role: document.getElementById('roleSelect').value,
        user_id: document.getElementById('userIdInput').value,
        domain: document.getElementById('domainSelect').value,
        subdomain: document.getElementById('subdomainSelect').value,
        tenant: document.getElementById('tenantInput').value,
        groq: document.getElementById('groqToggle').checked,
      })
    });
    const data = await r.json();
    if (data.error) {
      document.getElementById('results').innerHTML = `<span class="fail">Error: ${data.error}</span>`;
    } else {
      document.getElementById('results').innerHTML = renderReport(data);
    }
  } catch(e) {
    document.getElementById('results').innerHTML = `<span class="fail">Connection error: ${e}</span>`;
  }
  document.getElementById('spinner').style.display = 'none';
}

function renderReport(d) {
  const out = {
    prompt: {
      query: d.sql,
      user: d.user,
      domain: d.domain || "auto",
      subdomain: d.subdomain || "auto",
    },
    result: {
      status: d.status,
      fingerprint: d.fingerprint,
      reason: d.verdict_reason,
    },
    validation_errors: d.violations || [],
    suggested_corrections: (d.violations || []).map(v => v.fix).filter(Boolean),
    rls: (d.rls_checks || []).map(r => ({
      role: d.user.role,
      required_predicates: r.role_rules,
      resolved_predicates: r.resolved_predicates,
    })),
    cls: (d.cls_checks || []).map(c => ({
      role: d.user.role,
      domain: (d.domain || "auto") + " / " + (d.subdomain || "auto"),
      allowed_columns: c.allowed_columns,
      referenced_columns: c.referenced_columns,
      blocked_columns: c.blocked_columns,
    })),
    date_constraints: d.date_checks || [],
    groq_analysis: d.groq_analysis || null,
  };
  return `<pre style="color:var(--text);font-size:12px;line-height:1.4;margin:0">${JSON.stringify(out, null, 2)}</pre>`;
}

async function generateData() {
  const domain = document.getElementById('genDomain').value;
  const subdomain = document.getElementById('genSubdomain').value;
  const rows = document.getElementById('genRows').value;
  const groq = document.getElementById('genGroq').checked;

  document.getElementById('genResults').style.display = '';
  document.getElementById('genResults').innerHTML = '<span class="dim">Generating...</span>';

  try {
    const r = await fetch('/api/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ domain, subdomain, rows, groq })
    });
    const data = await r.json();
    if (data.error) {
      document.getElementById('genResults').innerHTML = `<span class="fail">${data.error}</span>`;
      return;
    }
    let h = `<span class="dim">${domain} / ${subdomain} — ${data.row_count} rows</span>\n\n`;
    if (data.rows.length) {
      h += '<table><thead><tr>';
      data.columns.forEach(c => h += `<th>${c}</th>`);
      h += '</tr></thead><tbody>';
      data.rows.forEach(row => {
        h += '<tr>';
        data.columns.forEach(c => h += `<td>${row[c] !== undefined ? row[c] : ''}</td>`);
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    document.getElementById('genResults').innerHTML = h;
  } catch(e) {
    document.getElementById('genResults').innerHTML = `<span class="fail">Error: ${e}</span>`;
  }
}

async function loadSchema() {
  try {
    const r = await fetch('/api/roles');
    const data = await r.json();
    let h = '';
    for (const [dom, subs] of Object.entries(data.subdomains)) {
      h += `<div class="domain">${dom}</div>`;
      for (const sd of subs) {
        h += `<div class="col-list">▸ ${sd}</div>`;
      }
    }
    document.getElementById('schemaPanel').innerHTML = h;
  } catch(e) {
    document.getElementById('schemaPanel').innerHTML = '<span class="dim">Schema unavailable</span>';
  }
}

async function loadPersona() {
  try {
    const r = await fetch('/api/persona');
    const d = await r.json();
    document.getElementById('tab-persona').innerHTML = d.persona;
  } catch(e) {
    document.getElementById('tab-persona').innerHTML = 'Persona unavailable.';
  }
}

async function handleBatchFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('batchFileName').textContent = file.name;
  document.getElementById('results').innerHTML = '<span class="dim">Uploading and validating...</span>';

  const form = new FormData();
  form.append('file', file);
  form.append('role', document.getElementById('batchRole').value);
  form.append('user_id', document.getElementById('batchUser').value);
  form.append('tenant', document.getElementById('batchTenant').value);
  form.append('groq', document.getElementById('batchGroq').checked);

  try {
    const r = await fetch('/api/batch', { method: 'POST', body: form });
    const data = await r.json();
    if (data.error) {
      document.getElementById('results').innerHTML = `<span class="fail">${data.error}</span>`;
      return;
    }
    renderBatchResults(data);
  } catch(e) {
    document.getElementById('results').innerHTML = `<span class="fail">Connection error: ${e}</span>`;
  }
}

function renderBatchResults(data) {
  const output = [];
  data.results.forEach((r, i) => {
    output.push({
      prompt: {
        query: r.sql,
        user: r.user,
        domain: r.domain || "auto",
        subdomain: r.subdomain || "auto",
      },
      result: {
        status: r.status,
        fingerprint: r.fingerprint,
        reason: r.verdict_reason,
      },
      validation_errors: r.violations || [],
      suggested_corrections: (r.violations || []).map(v => v.fix).filter(Boolean),
      rls: (r.rls_checks || []).map(rc => ({
        role: r.user.role,
        required_predicates: rc.role_rules,
        resolved_predicates: rc.resolved_predicates,
      })),
      cls: (r.cls_checks || []).map(c => ({
        role: r.user.role,
        domain: (r.domain || "auto") + " / " + (r.subdomain || "auto"),
        allowed_columns: c.allowed_columns,
        referenced_columns: c.referenced_columns,
        blocked_columns: c.blocked_columns,
      })),
      date_constraints: r.date_checks || [],
      groq_analysis: r.groq_analysis || null,
    });
  });

  const summary = {
    summary: { total: data.total, passed: data.passed, failed: data.failed },
    queries: output,
  };

  let h = `<div class="report">`;
  h += `<button class="ghost" onclick='downloadJSON(${JSON.stringify(JSON.stringify(summary))})' style="margin-bottom:12px">Download JSON Report</button>\n`;
  h += `<pre style="color:var(--text);font-size:12px;line-height:1.4;margin:0">${JSON.stringify(summary, null, 2)}</pre>`;
  h += `</div>`;
  document.getElementById('results').innerHTML = h;
}

function downloadJSON(jsonStr) {
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'validation_report.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
